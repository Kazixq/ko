<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Impressum</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face{font-family:"Geist";src:url("fonts/geist-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-display:swap}
:root{--bg:#000;--ink:#e9ecea;--dim:#8a918e;--line:rgba(233,236,234,.1);--accent:#8a5ad6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;line-height:1.65;font-size:15px;
  background:radial-gradient(ellipse at 50% 0%,rgba(100,36,190,.14),transparent 55%) no-repeat,var(--bg);min-height:100dvh}
main{max-width:640px;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 72px}
a.back{display:inline-block;color:var(--dim);font-size:13px;font-weight:600;text-decoration:none;letter-spacing:.04em;margin-bottom:40px}
a.back:hover{color:var(--ink)}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:28px}
h2{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:34px 0 10px}
p,li{color:#c9cfcc;font-weight:400}
p+p{margin-top:10px}
ul{padding-left:18px;margin-top:8px}
a{color:var(--ink);text-underline-offset:3px;text-decoration-color:var(--line)}
a:hover{text-decoration-color:var(--accent)}
.todo{background:rgba(138,90,214,.22);border-radius:4px;padding:0 4px;color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
</head>
<body>
<main>
<a class="back" href="/">&larr; Zurück</a>
<h1>Impressum</h1>
<h2>Angaben gemäß § 5 DDG</h2>
<p><span class="todo">[Vorname Nachname]</span><br><span class="todo">[Straße Hausnummer]</span><br><span class="todo">[PLZ Ort]</span><br><span class="todo">[Land]</span></p>
<h2>Kontakt</h2>
<p>E-Mail: <span class="todo">[deine@email.de]</span></p>
<h2>Verantwortlich für den Inhalt nach § 18 Abs. 2 MStV</h2>
<p><span class="todo">[Vorname Nachname, Anschrift wie oben]</span></p>
</main>
</body>
</html>
